      module: "Solution"
      status: "proved"
      note: "Equality in the first displayed bound holds exactly for prime n."
    - source: "Dimitrov, arXiv:2606.12484v1, Conjecture 3"
      lean: "PalomarDimitrov.conjecture3FullRange"
      module: "Solution"
