version: "v0.4"

project:
  name: "Lean proofs of Dimitrov's Conjectures 1 and 3"
  description: >-
    A Lean 4 formalization proving Dimitrov's Conjectures 1 and 3 for every
    natural k >= 1 and n >= 2. The results concern inequalities involving
    Euler's totient, Dedekind's psi function, and the sum-of-divisors function.
    The source paper proves the k = 1 instances and discusses k = 2, 3; this
    development covers the full stated range, including k >= 4, and additionally
    proves for each inequality that equality holds exactly when n is prime.
    By supplying the full parameter range and sharp equality cases beyond those
    treated in the source, the project is relevant to researchers in elementary
    and analytic number theory who study inequalities among multiplicative
    arithmetic functions, and to formal-mathematics researchers studying the
    verification of contemporary conjectures.
    Historical priority for the full-range proofs has not been established by
    expert or source-author review. The mathematical reductions, Lean code, and
    documentation were generated substantially by OpenAI Codex under human
    direction, as detailed below.
  authors:
    - "Michael Mazur"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Michael Mazur"

classification:
  arxiv: ["math.NT"]
  msc2020: ["11A25", "26D15"]

sources:
  - title: "Lower bounds on expressions depending on the functions phi(n), psi(n) and sigma(n), III"
    authors:
      - "S. I. Dimitrov"
    id: "arXiv:2606.12484v1"
    type: "paper"
    location: "Conjecture 1 on PDF page 3 and Conjecture 3 on PDF page 4"
    relationship: "formalizes"
    note: >-
      The source states both full-range conjectures, proves their k = 1 cases,
      and remarks on k = 2, 3. This repository supplies Lean-checked proofs for
      all k >= 1. No source-author confirmation or endorsement has been received.
    author_endorsement: "not-contacted"
  - title: "The generating identity of Cauchy-Schwarz-Bunyakovsky inequality"
    authors:
      - "A. M. Sommariva"
    id: "https://doi.org/10.4171/EM/78"
    type: "paper"
    location: "Elemente der Mathematik 63 (2008), 1-5"
    relationship: "background"
    note: >-
      Background for the classical Lagrange/Cauchy identity underlying the
      ratio-constrained analytic reduction used for Conjecture 1.
    author_endorsement: "not-contacted"
  - title: "Generalizations and refinements for Nesbitt's inequality"
    authors:
      - "Mihaly Bencze"
      - "Ovidiu T. Pop"
    id: "https://doi.org/10.7153/jmi-05-02"
    type: "paper"
    location: "Journal of Mathematical Inequalities 5(1) (2011), 13-20, Theorem 3.1"
    relationship: "background"
    note: >-
      Background for the analytic balancing step used for Conjecture 3; this
      repository formalizes the needed specialization and monotonicity argument.
    author_endorsement: "not-contacted"

related_formalizations: []

status:
  scope: >-
    The Comparator record covers four claims: the exact rational full-range
    forms of Conjectures 1 and 3 and the two companion equality-if-and-only-if-
    prime theorems. Challenge.lean's four deliberate sorries are excluded from
    these counts. The substantive proof development contains no sorry and no
    custom axiom. The source's other conjectures are outside this project.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "PalomarDimitrov.conjecture1FullRange"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
    - declaration: "PalomarDimitrov.conjecture1EqualityIffPrime"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
    - declaration: "PalomarDimitrov.conjecture3FullRange"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
    - declaration: "PalomarDimitrov.conjecture3EqualityIffPrime"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"

