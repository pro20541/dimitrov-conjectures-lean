fidelity:
  divergences: >-
    No known change to either source conjecture's quantified range or displayed
    inequality. The theorems are stated over the rationals, which is equivalent
    to the usual real interpretation for these rational-valued expressions.
    Dedekind psi is defined by the source's standard prime-factor product; the
    hypothesis n >= 2 makes the convention at zero irrelevant. The two equality
    iff prime theorems are additional results proved by this project rather than
    claims attributed to the source paper.

review:
  status: "agent-reviewed"
  reviewers:
    - "OpenAI Codex (separate statement, proof, verification, and prior-art audit runs)"
  notes: >-
    Separate AI-assisted audits checked the source transcription, proof shape,
    equality statements, numerical behavior, axioms, and available prior art.
    No independent human mathematical review and no source-author verification
    have been completed as of 2026-09-13.

